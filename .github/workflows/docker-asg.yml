# 워크플로우(작업) 이름
name: GitOps CI Pipeline
# 1. 트리거 설정: 브랜치 정의
on:
  push:
    branches:
    - main

jobs:
  build-and-update:
    runs-on: ubuntu-latest  # 실제 작업 주체
    
    # 작업 절차
    steps:
    - name: 소스코드 전송
      uses: actions/checkout@v4
    
    - name: AWS 자격 증명 설정
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{secrets.AWS_ACCESS_KEY}}
        aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
        aws-region: ${{secrets.AWS_REGION}}

    # ECR에 Docker 이미지 빌드 및 푸시
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push Docker image to ECR
      # env: 
      #   ECR_REGISTRY: ${{}}
      #   ECR_REPOSITORY: ${{}}
      #   IMAGE_TAG: ${{github.sha}}
      run: |
        docker build --no-cache -t 925047940866.dkr.ecr.ca-central-1.amazonaws.com/std09/nginx:1.31.3-ecr ./nginx
        docker build --no-cache -t 925047940866.dkr.ecr.ca-central-1.amazonaws.com/std09/nginx:latest ./nginx

        docker push 925047940866.dkr.ecr.ca-central-1.amazonaws.com/std09/nginx:1.31.3-ecr
        docker push 925047940866.dkr.ecr.ca-central-1.amazonaws.com/std09/nginx:latest
        
    - name: S3 정적 웹사이트로 배포
      run: |
        # 전체 동기화
        aws s3 cp ./docker-compose.yaml s3://bipa17-std09-cicd-925047940866-ca-central-1-website/docker-compose.yaml --delete

    - name: 컨테이너 배포
      run: |
        aws ssm send-command \
          --targets "Key=tag:Cicd,Values=asg" \
          --document-name "AWS-RunShellScript" \
          --parameters "commands=[
          \"aws ecr get-login-password --region ca-central-1 | docker login --username AWS --password-stdin 925047940866.dkr.ecr.ca-central-1.amazonaws.com\",
          \"sudo docker stop nginx-container || true\",
          \"sudo docker rm nginx-container || true\",
          \"aws s3 cp s3://bipa17-std09-cicd-925047940866-ca-central-1-website/docker-compose.yaml ./docker-compose.yaml\",
          \"docker compose pull\",
          \"docker compose up -d --remove-orphans\",
          \"docker image prune -f\"
          ]" \
          --region ${{secrets.AWS_REGION}} \
          --comment "Deploying SSM"